<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catatan Keuangan Mahasiswa</title>
  <link rel="stylesheet" href="project.css" />
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="menu-wrap profile-wrap">
        <button type="button" class="profile-trigger" id="btnMenu" aria-expanded="false">
          <img id="fotoProfilMini" class="profile-mini" alt="Foto profil" />
          <span id="namaProfilMini">Profil</span>
          <span>⌄</span>
        </button>
        <div class="menu-panel profile-panel" id="menuPanel" hidden>
          <div class="profile-heading">
            <img id="fotoProfilMenu" class="profile-large" alt="Foto profil" />
            <div>
              <strong id="menuTitle">Profil</strong>
              <span id="profilSubjudul">Kelola akun dan preferensi</span>
            </div>
          </div>
          <button type="button" class="menu-link" data-panel="profil">Biodata profil</button>
          <button type="button" class="menu-link" data-panel="tampilan">Tema tampilan</button>
          <button type="button" class="menu-link" data-panel="ringkasan">Ringkasan bulanan</button>
          <button type="button" class="menu-link" data-panel="akun">Beralih akun</button>

          <section class="menu-detail" id="panelProfil" hidden>
            <label for="namaPengguna">Nama pengguna</label>
            <input type="text" id="namaPengguna" placeholder="Masukkan nama" />
            <label for="tanggalLahir">Tanggal lahir</label>
            <input type="date" id="tanggalLahir" />
            <label for="statusProfil">Sedang menempuh pendidikan / bekerja</label>
            <select id="statusProfil">
              <option value="Pelajar / Mahasiswa">Pelajar / Mahasiswa</option>
              <option value="Bekerja">Bekerja</option>
              <option value="Lainnya">Lainnya</option>
            </select>
            <label for="pekerjaanProfil">Kerja sebagai / sekolah dimana</label>
            <input type="text" id="pekerjaanProfil" placeholder="Contoh: Universitas atau kantor" />
            <label for="deskripsiProfil">Deskripsi</label>
            <textarea id="deskripsiProfil" rows="3" placeholder="Tulis deskripsi sesuai keinginan"></textarea>
            <label class="foto-profil-input" for="fotoProfil">
              <span>Foto profil</span>
              <input type="file" id="fotoProfil" accept="image/*" />
            </label>
            <button type="button" class="menu-action" id="btnSimpanProfil">Simpan profil</button>
          </section>

          <section class="menu-detail" id="panelTampilan" hidden>
            <span class="menu-detail-title">Pilih suasana aplikasi</span>
            <div class="tema-switch">
              <button type="button" id="temaGelap" class="tema-button">Dark</button>
              <button type="button" id="temaTerang" class="tema-button">Light</button>
            </div>
          </section>

          <section class="menu-detail ringkasan-menu" id="panelRingkasan" hidden>
            <span class="menu-detail-title">Ringkasan bulan aktif</span>
            <div class="menu-stat"><span>Pemasukan</span><strong id="menuTotalPemasukan">Rp0</strong></div>
            <div class="menu-stat"><span>Pengeluaran</span><strong id="menuTotalPengeluaran">Rp0</strong></div>
            <div class="menu-stat menu-balance"><span>Sisa saldo</span><strong id="menuSisaSaldo">Rp0</strong></div>
          </section>

          <section class="menu-detail" id="panelAkun" hidden>
            <span class="menu-detail-title">Pilih profil</span>
            <select id="pilihAkun"></select>
            <button type="button" class="menu-action" id="btnBeralihAkun">Beralih ke profil</button>
            <button type="button" class="menu-secondary" id="btnTambahAkun">+ Tambah profil baru</button>
          </section>
        </div>
      </div>
      <div class="brand">
        <span class="brand-mark">CK</span>
        <span>Catatan Keuangan</span>
      </div>
    </header>

    <main class="app">
      <h1>Catatan Keuangan</h1>
 
    <div class="periode-box">
      <label for="pilihBulan">Riwayat bulan</label>
      <input type="month" id="pilihBulan" />
    </div>
 
    <div class="mode-switch" role="tablist" aria-label="Jenis transaksi">
      <button type="button" id="modePengeluaran" class="mode-button aktif">Pengeluaran</button>
      <button type="button" id="modePemasukan" class="mode-button">Pemasukan</button>
    </div>

    <div class="form-tambah">
      <input type="date" id="tanggalPengeluaran" aria-label="Tanggal pengeluaran" />
      <input type="text" id="namaPengeluaran" placeholder="nama pengeluaran" />
      <input type="number" id="jumlahPengeluaran" placeholder="Jumlah" min="0" />
      <label class="foto-input" for="fotoStruk">
        <span>Foto struk</span>
        <input type="file" id="fotoStruk" accept="image/*" />
      </label>
      <button id="btnTambah">+ Tambah pengeluaran</button>
    </div>
 
    <div id="daftarPengeluaran" class="daftar"></div>
 
    <div class="ringkasan">
      <div class="baris pemasukan-row">
        <span>Total Pemasukan</span>
        <span id="totalPemasukan">Rp0</span>
      </div>
      <div class="baris pengeluaran-row">
        <span>Total Pengeluaran</span>
        <span id="totalPengeluaran">Rp0</span>
      </div>
      <div class="baris sisa">
        <span>Sisa saldo yang bisa digunakan</span>
        <span id="sisaSaldo">Rp0</span>
      </div>
    </div>
    </main>
  </div>
 
  <script src="project.js"></script>
</body>
</html>
